name: A1 Contract Pin CI
on:
  pull_request:
    paths:
      - "contracts/**"
      - "internal/contract/**"
      - "cmd/contractcheck/**"
      - "go.mod"
      - ".github/workflows/a1-contract-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: A1 Go pin and fixture tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout Agent PR
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - name: Check canonical pinned byte hashes and schema headers
        run: go run ./cmd/contractcheck -root .
      - name: Go unit, semantic and portable-numeric regressions
        run: go test -v -count=1 ./...
      - name: Go vet
        run: go vet ./...
