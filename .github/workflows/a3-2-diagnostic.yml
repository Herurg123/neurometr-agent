name: A3.3 trusted bundled catalog and ordinary offline Windows JSON
on:
  pull_request:
    paths:
      - 'bundled/**'
      - '.gitattributes'
      - 'internal/catalogpin/**'
      - 'cmd/catalogcheck/**'
      - 'internal/diagnostic/**'
      - 'cmd/diagnose/**'
      - 'tests/diagnostic/**'
      - 'docs/A3_2_NATIVE_DIAGNOSTIC.md'
      - 'docs/A3_3_BUNDLED_CATALOG.md'
      - '.github/workflows/a3-2-diagnostic.yml'
  workflow_dispatch:

concurrency:
  group: a3-3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Unit and canonical contract regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout Agent only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check exact canonical A1 lock
        run: go run ./cmd/contractcheck -root .
      - name: Verify owner-approved bundled catalog and full catalog schema
        run: go run ./cmd/catalogcheck -root .
      - name: Test A1-A3.3 including F01-F08, bundled tampering, offline, PII
        run: go test -v -count=1 ./...
      - name: Cross-compile pure Windows x64 CLI
        if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/neurometr-a3-smoke.exe" ./cmd/diagnose
      - name: Static Go checks
        run: go vet ./...

  native-smoke:
    name: Ordinary Windows native JSON + Go/Web oracle, private no-upload
    needs: core
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - name: Checkout Agent only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout immutable Web Python reference (read only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Herurg123/neurometr-web
          ref: bb828bb09372e16cf63d04371d5f9367eee2526e
          path: reference-web
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Web reference dependencies
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4'
      - name: Verify approved bundled catalog pin
        run: go run ./cmd/catalogcheck -root .
      - name: Real Windows ordinary bundled diagnostic and private validation
        run: python tests/diagnostic/smoke.py
      - name: Confirm pin byte hashes remain intact
        run: go run ./cmd/contractcheck -root .
