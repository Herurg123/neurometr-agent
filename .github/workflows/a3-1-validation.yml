name: A3.1 full contract validation + differential oracle

on:
  pull_request:
    paths:
      - 'internal/contract/**'
      - 'cmd/contractvalidate/**'
      - 'tests/differential/**'
      - 'docs/A3_1_VALIDATION_AND_LATENCY.md'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/a3-1-validation.yml'
  workflow_dispatch:

concurrency:
  group: a3-1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation:
    name: Go and pinned Python parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout Agent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout exact canonical Web Python oracle (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Herurg123/neurometr-web
          ref: 97aa0f4c1ceaef36608288e589b8abe935c5189e
          path: reference-web
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact Web B1 reference validator dependencies
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4'
      - name: Resolve pinned Go module checksums (bootstrap validation)
        run: |
          go mod tidy
          go mod verify
          cat go.mod
          cat go.sum
      - name: Verify immutable canonical files
        run: go run ./cmd/contractcheck -root .
      - name: Go Draft 2020-12 and semantic regression suite
        run: go test -v -count=1 ./...
      - name: Build Go comparator
        run: go build -o build-a3-check ./cmd/contractvalidate
      - name: Differential Go/Python F01-F08, numeric and mutation corpus
        run: python tests/differential/compare.py
      - name: Go vet
        run: go vet ./...
