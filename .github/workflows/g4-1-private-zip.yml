name: G4.2 verified Windows ZIP (publication gated by license audit)
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'internal/g4bundle/**'
      - 'cmd/g4pack/**'
      - 'tests/g4/**'
      - 'packaging/**'
      - 'docs/G4_1_INTERNAL_WINDOWS_ZIP.md'
      - 'docs/G4_2_ACTIONS_ARTIFACT.md'
      - 'README.md'
      - '.github/workflows/g4-1-private-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g4-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Go contracts, history, HTTP and hostile ZIP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 17
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout approved Agent source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Use deterministic Go 1.23.12
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Verify approved source contract pin
        run: go run ./cmd/contractcheck -root .
      - name: Verify offline catalog pin
        run: go run ./cmd/catalogcheck -root .
      - name: All Go unit/integration tests, canonical F01-F08 and unsafe ZIP negatives
        run: go test -v -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Cross-build Windows x64 EXE with no CGO
        if: runner.os == 'Linux'
        shell: bash
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false '-ldflags=-buildid=' -o "$RUNNER_TEMP/Neurometr.exe" ./cmd/localui

  packaged-windows:
    name: Real native Windows unpacked ZIP; gated main-only artifact
    runs-on: windows-2025
    needs: go-tests
    timeout-minutes: 20
    env:
      G4_EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      CGO_ENABLED: '0'
    steps:
      - name: Checkout exact expected Agent feature HEAD (not PR merge)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fail closed unless git checkout SHA matches expected source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -notmatch '^[0-9a-f]{40}$' -or $actual -cne $env:G4_EXPECTED_SOURCE_COMMIT.ToLowerInvariant()) {
            throw 'G4_1_CHECKOUT_SOURCE_SHA_MISMATCH'
          }
          ('G4_VERIFIED_CHECKOUT_COMMIT=' + $actual) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host ('G4_1_CHECKOUT_SHA_VERIFIED=PASS HEAD=' + $actual + ' EXPECTED=' + $env:G4_EXPECTED_SOURCE_COMMIT)
      - name: Checkout frozen Web Python oracle READ-ONLY
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Herurg123/neurometr-web
          ref: c0b9bc9d3a0e99e69dbde5f00f722b0225255b96
          path: reference-web
          persist-credentials: false
      - name: Use deterministic Go 1.23.12
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Use Python only for CI oracle, not bundled runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned schema oracle dependencies outside ZIP
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4'
      - name: Fetch ONLY official llmfit 1.1.20 asset to private CI temp and verify SHA Authenticode version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $expected = '1f848ddf2554adb89b3a31a034245826694148249fadace572c4544bb3c9c489'
          $url = 'https://github.com/AlexsJones/llmfit/releases/download/v1.1.20/llmfit-v1.1.20-x86_64-pc-windows-msvc.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'llmfit-v1.1.20-x86_64-pc-windows-msvc.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive -MaximumRedirection 5
          if ((Get-Item -LiteralPath $archive).Length -ne 6878103) { throw 'OFFICIAL_ARCHIVE_LENGTH_MISMATCH' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'OFFICIAL_ARCHIVE_SHA256_MISMATCH' }
          Add-Type -AssemblyName System.IO.Compression
          $za = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            if ($za.Entries.Count -eq 0 -or $za.Entries.Count -gt 30) { throw 'UNEXPECTED_OFFICIAL_ARCHIVE_COUNT' }
            $total = [long]0
            foreach ($entry in $za.Entries) {
              $n = $entry.FullName
              if ($n.StartsWith('/') -or $n.StartsWith('\') -or $n.Contains('..') -or $n.Contains(':') -or $n.Contains('\')) { throw 'UNSAFE_OFFICIAL_ARCHIVE_ENTRY' }
              $total += $entry.Length
              if ($total -gt 134217728) { throw 'OVERSIZED_OFFICIAL_ARCHIVE' }
            }
            $binaries = @($za.Entries | Where-Object { $_.Name -ieq 'llmfit.exe' })
            if ($binaries.Count -ne 1) { throw 'EXPECTED_ONE_OFFICIAL_EXE' }
            $exe = Join-Path $env:RUNNER_TEMP 'g4.1-pinned-official-llmfit.exe'
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($binaries[0],$exe,$false)
          } finally { $za.Dispose() }
          if ((Get-AuthenticodeSignature -LiteralPath $exe).Status -ne 'Valid') { throw 'AUTHENTICODE_INVALID' }
          $version = (& $exe --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne 'llmfit 1.1.20') { throw 'OFFICIAL_LLMFIT_VERSION_MISMATCH' }
          ('G4_OFFICIAL_ARCHIVE=' + $archive) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          ('G4_VERIFIED_LLMFIT_EXE=' + $exe) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'G4_1_OFFICIAL_SOURCE=PASS VERSION=1.1.20 AUTHENTICODE=Valid ARCHIVE_BYTES=6878103'
      - name: Checkout tagged upstream llmfit source for read-only Windows CLI audit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: AlexsJones/llmfit
          ref: bb5771394e88e352c266f4bf8bdb7a5295a998a8
          path: llmfit-audit-source
          persist-credentials: false
      - name: Reconstruct Windows CLI Rust normal/build dependency graph, npm production scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $audit = Join-Path $env:RUNNER_TEMP 'g4.2-windows-cli-source-audit.json'
          python tests/g4/audit_llmfit_windows_cli.py --upstream llmfit-audit-source --output $audit
          if ($LASTEXITCODE -ne 0) { throw 'G4_2_TARGET_CLI_AUDIT_FAILED' }
          ('G4_LLMFIT_TARGET_AUDIT=' + $audit) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build standalone Win x64 Neurometr.exe in private runner temp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go build -trimpath -buildvcs=false '-ldflags=-buildid=' -o "$env:RUNNER_TEMP\Neurometr.exe" ./cmd/localui
          if ($LASTEXITCODE -ne 0) { throw 'G4_AGENT_COMPILE_FAILED' }
          if ((Get-Item -LiteralPath "$env:RUNNER_TEMP\Neurometr.exe").Length -le 0) { throw 'EMPTY_EXE' }
          Write-Host 'G4_1_STANDALONE_EXE=PASS CGO_ENABLED=0'
      - name: Build same private ZIP twice, verify exact reproducibility and inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:RUNNER_TEMP 'Neurometr.exe'
          $one = Join-Path $env:RUNNER_TEMP 'neurometr-g4.1-internal-a.zip'
          $two = Join-Path $env:RUNNER_TEMP 'neurometr-g4.1-internal-b.zip'
          go run ./cmd/g4pack pack -root . -exe $exe -official-archive $env:G4_OFFICIAL_ARCHIVE -out $one -source-commit $env:G4_VERIFIED_CHECKOUT_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_PACK_FAILED' }
          go run ./cmd/g4pack pack -root . -exe $exe -official-archive $env:G4_OFFICIAL_ARCHIVE -out $two -source-commit $env:G4_VERIFIED_CHECKOUT_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'PRIVATE_SECOND_PACK_FAILED' }
          $h1 = (Get-FileHash -LiteralPath $one -Algorithm SHA256).Hash.ToLowerInvariant()
          $h2 = (Get-FileHash -LiteralPath $two -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($h1 -ne $h2) { throw 'NONDETERMINISTIC_ARCHIVE' }
          $sz = (Get-Item -LiteralPath $one).Length
          Write-Host ('G4_1_ZIP_REPRODUCIBLE=PASS BYTES=' + $sz + ' SHA256=' + $h1)
          ('G4_PRIVATE_ZIP=' + $one) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          go run ./cmd/g4pack verify -zip $one
          if ($LASTEXITCODE -ne 0) { throw 'ZIP_INVENTORY_FAIL' }
      - name: Strictly verify and unpack ZIP into path with spaces
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'G4 unpacked offline application with spaces'
          go run ./cmd/g4pack verify -zip $env:G4_PRIVATE_ZIP -dest $dest
          if ($LASTEXITCODE -ne 0) { throw 'SAFE_EXTRACT_FAILED' }
          go run ./cmd/contractcheck -root $dest
          if ($LASTEXITCODE -ne 0) { throw 'UNPACKED_CONTRACT_PIN_FAIL' }
          go run ./cmd/catalogcheck -root $dest
          if ($LASTEXITCODE -ne 0) { throw 'UNPACKED_CATALOG_PIN_FAIL' }
          $provenance = Get-Content -Raw -LiteralPath (Join-Path $dest 'release-manifest.json') | ConvertFrom-Json
          if ($provenance.agent_source_commit -cne $env:G4_VERIFIED_CHECKOUT_COMMIT -or $provenance.agent_source_commit -cne $env:G4_EXPECTED_SOURCE_COMMIT) {
            throw 'G4_1_MANIFEST_CHECKOUT_SHA_MISMATCH'
          }
          Write-Host ('G4_1_MANIFEST_CHECKOUT_SHA_VERIFIED=PASS SOURCE=' + $provenance.agent_source_commit)
          ('G4_UNPACKED_PRIVATE=' + $dest) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $hAgent = (Get-FileHash -LiteralPath (Join-Path $dest 'Neurometr.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $hCli = (Get-FileHash -LiteralPath (Join-Path $dest 'bin\llmfit.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $hManifest = (Get-FileHash -LiteralPath (Join-Path $dest 'release-manifest.json') -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ('G4_1_PACKAGE_FILE_SHA256_AGENT=' + $hAgent + ' LLMFIT=' + $hCli + ' MANIFEST=' + $hManifest)
          Write-Host 'G4_1_EXTRACTED_CONTRACTS_AND_CATALOG=PASS'
      - name: Real packaged Windows localhost, no SDK, native diagnostic, restart, missing CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/g4/smoke.py $env:G4_UNPACKED_PRIVATE $env:G4_PRIVATE_ZIP $env:G4_VERIFIED_LLMFIT_EXE
          if ($LASTEXITCODE -ne 0) { throw 'UNPACKED_WINDOWS_SMOKE_FAILED' }
      - name: Validate main-only redistribution gate rules (negative and hypothetical positive tests)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s tests/g4 -p 'test_publication_gate.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'G4_2_GATE_UNIT_TESTS_FAILED' }
      - name: Prepare SHA256SUMS and validate two-file download payload (still private)
        id: delivery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = $env:G4_VERIFIED_CHECKOUT_COMMIT
          if ($sha -cne $env:G4_EXPECTED_SOURCE_COMMIT -or $sha -notmatch '^[a-f0-9]{40}$') { throw 'G4_2_SOURCE_PROVENANCE_MISMATCH' }
          $dir = Join-Path $env:RUNNER_TEMP 'G4 verified download payload - private until approved'
          New-Item -ItemType Directory -Path $dir -ErrorAction Stop | Out-Null
          $filename = 'Neurometr-Windows-x64-' + $sha + '.zip'
          $copy = Join-Path $dir $filename
          Copy-Item -LiteralPath $env:G4_PRIVATE_ZIP -Destination $copy -ErrorAction Stop
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $copy).Hash.ToLowerInvariant()
          $length = (Get-Item -LiteralPath $copy).Length
          $line = $digest + ' *' + $filename + "`n"
          [System.IO.File]::WriteAllText((Join-Path $dir 'SHA256SUMS.txt'),$line,[System.Text.UTF8Encoding]::new($false))
          python tests/g4/check_download_payload.py --dir $dir --commit $sha --public
          if ($LASTEXITCODE -ne 0) { throw 'G4_2_DOWNLOAD_PAYLOAD_INTEGRITY_FAILED' }
          ('folder=' + $dir) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          ('commit=' + $sha) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          ('zip_sha256=' + $digest) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          ('zip_size=' + $length) | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host ('G4_2_CHECKSUM_SIDECAR=PASS BYTES=' + $length + ' SHA256=' + $digest)
      - name: Fail-closed license and distribution approval check
        id: license_gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tests/g4/publication_gate.py --policy packaging/public_artifact_gate.json --rust-audit-report $env:G4_LLMFIT_TARGET_AUDIT --output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'G4_2_PUBLICATION_GATE_ERROR' }
      - name: Validate user-facing redistribution labels only if license audit is approved
        if: steps.license_gate.outputs.approved == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          python tests/g4/check_download_payload.py --dir '${{ steps.delivery.outputs.folder }}' --commit '${{ steps.delivery.outputs.commit }}' --public
          if ($LASTEXITCODE -ne 0) { throw 'G4_2_USER_DISTRIBUTION_METADATA_NOT_READY' }
      - name: Upload verified ZIP and SHA256SUMS (main only, after all tests and licensing)
        id: published
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && steps.license_gate.outputs.approved == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neurometr-windows-x64-${{ steps.delivery.outputs.commit }}
          path: ${{ steps.delivery.outputs.folder }}
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          compression-level: 0
          retention-days: 14
      - name: Write downloadable ZIP metadata and gated publication status to Actions Summary
        if: success()
        shell: pwsh
        run: |
          $lines = @(
            '## Нейрометр Windows x64 — проверенная CI-сборка'
            '',
            ('- Source commit: `${{ steps.delivery.outputs.commit }}`'),
            ('- ZIP: `Neurometr-Windows-x64-${{ steps.delivery.outputs.commit }}.zip`'),
            ('- ZIP size: **${{ steps.delivery.outputs.zip_size }} bytes**'),
            ('- Application ZIP SHA-256: `${{ steps.delivery.outputs.zip_sha256 }}`'),
            '- llmfit: **v1.1.20**, fixed official archive SHA-256 `1f848ddf2554adb89b3a31a034245826694148249fadace572c4544bb3c9c489`',
            '- Windows unpacked smoke: **PASS**; Go/Python validators, history and ZIP negatives: **PASS**',
            '- SHA256SUMS.txt is the checksum for the inner application ZIP, not the outer GitHub Actions artifact container.'
          )
          if ('${{ steps.published.outputs.artifact-url }}' -ne '') {
            $lines += ('- Downloadable artifact: [neurometr-windows-x64-${{ steps.delivery.outputs.commit }}](${{ steps.published.outputs.artifact-url }})')
          } else {
            $lines += '- Downloadable artifact: **BLOCKED** (redistribution audit incomplete or PR/non-main run)'
            $lines += ('- License gate: `${{ steps.license_gate.outputs.reason }}`')
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n") -Encoding utf8
      - name: Remove private ZIP and staged payload from ephemeral Windows runner
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'neurometr-g4.1-internal-*.zip' -File -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Filter 'G4 verified download payload - private until approved' -Directory -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'G4_2_EPHEMERAL_CLEANUP=PASS'
