name: A3.4 guarded localhost UI and per-user private history
on:
  pull_request:
    paths:
      - 'internal/history/**'
      - 'internal/localui/**'
      - 'cmd/localui/**'
      - 'tests/localui/**'
      - 'docs/A3_4_LOCALHOST_HISTORY.md'
      - 'README.md'
      - '.github/workflows/a3-4-localui.yml'
  workflow_dispatch:

concurrency:
  group: a3-4-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Security, history and contract regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Checkout Agent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify approved contracts unchanged
        run: go run ./cmd/contractcheck -root .
      - name: Verify immutable bundled catalog
        run: go run ./cmd/catalogcheck -root .
      - name: Go tests including F01-F08, security, corruption and PII
        run: go test -v -count=1 ./...
      - name: Static analysis
        run: go vet ./...
      - name: Compile Windows x64 local UI
        if: runner.os == 'Linux'
        shell: bash
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/neurometr-ui.exe" ./cmd/localui

  windows-native:
    name: Real Windows loopback API + ACL + history persistence + Web validator
    runs-on: windows-2025
    needs: core
    timeout-minutes: 14
    steps:
      - name: Checkout Agent
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout Web Python oracle read-only at approved commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Herurg123/neurometr-web
          ref: c0b9bc9d3a0e99e69dbde5f00f722b0225255b96
          path: reference-web
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned Web reference validator
        run: python -m pip install --disable-pip-version-check 'jsonschema==4.25.1' 'rfc3339-validator==0.1.4'
      - name: Build local Windows executable for ephemeral CI test only (no artifact)
        shell: pwsh
        run: go build -o "$env:RUNNER_TEMP\neurometr-a34-ci.exe" ./cmd/localui
      - name: Private Windows UI and persisted diagnostic smoke
        shell: pwsh
        run: python tests/localui/smoke.py "$env:RUNNER_TEMP\neurometr-a34-ci.exe"
      - name: Check contract and bundled catalog pins after smoke
        run: |
          go run ./cmd/contractcheck -root .
          go run ./cmd/catalogcheck -root .
